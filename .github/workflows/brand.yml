name: Brand check

# Why this file exists (2026-11-09, DM S749): breezehw.com was re-skinned to the
# Breeze VI tokens. This job goes red on a push or PR that brings back a colour or
# font outside those tokens, or a colour class that compiles to no CSS (a typo, a
# removed token, two classes glued together), or a hover/focus state that repeats
# its base class and so changes nothing.
#
# The checker in brand/ is VENDORED from the owner repo by sync-breeze-ci.mjs.
# Do not edit it here: change the owner and re-sync. brand/tokens.json is a
# public projection of the owner's tokens (values only).
#
# What this does NOT do: a red run does not stop Vercel deploying a push to main,
# and it does not block a direct push unless branch protection requires this
# check. Until then, run `npm run check:brand` before pushing.
#
# Node pinned to the Vercel project's nodeVersion (24.x, read 2026-11-09).

on:
  push:
  pull_request:

jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Prove the checker can fail before trusting a green from it.
      - run: node brand/brand-check.mjs --selftest
      - run: node brand/brand-check.mjs --no-design --root src --root scripts --root public
      - run: npm ci
      - run: npx next build
      - run: node brand/site-class-audit.mjs .
